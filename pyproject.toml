[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verilator-model-sidecar"
version = "0.1.0"
description = "Backend-neutral semantic manifest extraction from Verilator models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
verilator-model-sidecar = "verilator_model_sidecar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
